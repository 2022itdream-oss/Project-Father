name: 🛡️ Automated Quad-Track Syntax Verification Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # --- Track 0: Project Father Node.js & Jest Unit Tests ---
  verify-node-app:
    name: ⚡ Node.js & Jest Test Suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Run Jest Unit Tests
      run: npm test

  # --- Track 01: Rust Syntax Audit ---
  verify-track-01:
    name: 🏛️ Track 01 (Rust) Syntax Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Verify Core Ledger Syntax Compiler
      run: |
        if [ -f track-01-core-ledger/anti_hoarding_engine.rs ]; then
          rustc --crate-type=lib --edition=2021 --emit=metadata track-01-core-ledger/anti_hoarding_engine.rs
          echo "Track 01 logic checks successfully processed."
        fi

  # --- Track 02: C++ Syntax Audit ---
  verify-track-02:
    name: 📡 Track 02 (C++) Syntax Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Shortwave Routing Compilation Bounds
      run: |
        if [ -f track-02-dtn-mesh/dtn_packet_router.cpp ]; then
          g++ -c -Wall track-02-dtn-mesh/dtn_packet_router.cpp -o /dev/null
          echo "Track 02 layout checks successfully processed."
        fi

  # --- Tracks 03 & 04: Python Syntax Audit ---
  verify-track-03-04:
    name: 🤖🧪 Tracks 03 & 04 (Python) Syntax Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Linting Tools
      run: pip install pyflakes
    - name: Audit Ensemble AI & Hardware Optimization Code
      run: |
        if [ -f track-03-ensemble-ai/ai_consensus_engine.py ]; then
          pyflakes track-03-ensemble-ai/ai_consensus_engine.py
        fi
        if [ -f track-04-hardware-autarky/hardware_autarky_spec.py ]; then
          pyflakes track-04-hardware-autarky/hardware_autarky_spec.py
        fi
        echo "Python specifications verified cleanly."